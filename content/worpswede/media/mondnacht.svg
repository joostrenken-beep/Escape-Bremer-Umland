<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- „Mondnacht am Weyerberg“ – fiktives Gemälde (Illustration für die Tour, gezeichnet für dieses Projekt) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1d3a"/>
      <stop offset="0.55" stop-color="#2c4a72"/>
      <stop offset="1" stop-color="#5f7d8f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36536b"/>
      <stop offset="1" stop-color="#1b2b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#sky)"/>
  <!-- Sterne -->
  <g fill="#fdf3c8">
    <circle cx="60" cy="70" r="2"/><circle cx="140" cy="40" r="1.5"/><circle cx="230" cy="90" r="2"/>
    <circle cx="520" cy="60" r="1.6"/><circle cx="560" cy="140" r="1.4"/><circle cx="330" cy="40" r="1.3"/>
    <circle cx="90" cy="170" r="1.4"/><circle cx="470" cy="190" r="1.2"/>
  </g>
  <!-- Mond mit Hof -->
  <circle cx="420" cy="150" r="110" fill="url(#glow)"/>
  <circle cx="420" cy="150" r="52" fill="#f6e7a6"/>
  <circle cx="404" cy="138" r="9" fill="#e8d48a"/><circle cx="436" cy="168" r="6" fill="#e8d48a"/>
  <!-- Weyerberg mit Kirchturm -->
  <path d="M0 360 C120 300 230 270 330 300 S520 330 600 350 V420 H0Z" fill="#23361f"/>
  <path d="M250 284 l8 -40 l8 40z M252 284 h12 v22 h-12z" fill="#1a2617"/>
  <!-- Moorwiesen -->
  <path d="M0 400 C150 380 300 395 600 385 V460 H0Z" fill="#3e5a2c"/>
  <!-- Wasser mit Mondspiegelung -->
  <rect y="455" width="600" height="145" fill="url(#water)"/>
  <g fill="#f6e7a6" opacity="0.8">
    <rect x="395" y="470" width="50" height="4" rx="2"/><rect x="385" y="490" width="70" height="4" rx="2"/>
    <rect x="400" y="512" width="40" height="4" rx="2"/><rect x="390" y="535" width="60" height="3" rx="2"/>
    <rect x="405" y="560" width="30" height="3" rx="2"/>
  </g>
  <!-- Bauernkate mit Licht -->
  <path d="M60 400 l40 -34 l40 34z" fill="#2a1d14"/>
  <rect x="68" y="400" width="64" height="30" fill="#3b2a1e"/>
  <rect x="92" y="408" width="12" height="10" fill="#f2c45a"/>
  <!-- Birken -->
  <g stroke="#f1eee4" stroke-width="7" stroke-linecap="round">
    <path d="M190 470 C188 400 196 330 192 250"/>
    <path d="M520 470 C524 410 516 350 522 290"/>
    <path d="M555 470 C552 420 560 380 556 330"/>
  </g>
  <g stroke="#1b1712" stroke-width="3">
    <path d="M187 300 h8 M189 360 h7 M188 420 h8"/><path d="M518 330 h8 M520 400 h8"/><path d="M553 380 h7"/>
  </g>
  <g fill="#6f8f45" opacity="0.85">
    <ellipse cx="175" cy="250" rx="34" ry="22"/><ellipse cx="210" cy="275" rx="30" ry="18"/>
    <ellipse cx="505" cy="295" rx="30" ry="20"/><ellipse cx="545" cy="315" rx="28" ry="18"/>
  </g>
  <!-- Signatur -->
  <text x="575" y="588" font-family="Georgia, serif" font-size="16" fill="#cbb98a" text-anchor="end" font-style="italic">J. Behrens 1902</text>
</svg>
