  <rect width="600" height="800" fill="#e9dcc0"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#8a7350" stroke-width="4" stroke-dasharray="14 10"/>
  <g fill="none" stroke="#6b5537" stroke-width="5">
    <path d="M120 470 L300 310 L480 470"/>
    <rect x="150" y="470" width="300" height="190"/>
    <rect x="270" y="560" width="60" height="100"/>
    <rect x="180" y="510" width="50" height="50"/><rect x="370" y="510" width="50" height="50"/>
    <path d="M200 660 h200 M180 690 h240 M160 720 h280"/>
  </g>
  <text x="300" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#5a4630">Historisches Foto</text>
  <text x="300" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#5a4630">Barkenhoff um 1900</text>
  <text x="300" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#9e2b25">[PLATZHALTER – Foto folgt]</text>
